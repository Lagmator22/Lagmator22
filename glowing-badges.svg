<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <style>
    @keyframes pulse-badges {
      0%, 100% { filter: drop-shadow(0 0 2px #e3b341) drop-shadow(0 0 5px #e3b341); transform: scale(1); }
      50% { filter: drop-shadow(0 0 4px #f2c94c) drop-shadow(0 0 8px #f2c94c); transform: scale(1.05); }
    }
    .glow-icon {
      animation: pulse-badges 3s infinite ease-in-out;
      transform-origin: center;
    }
  </style>
  <g class="glow-icon">
    <polygon fill="none" stroke="#e3b341" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
  </g>
</svg>
